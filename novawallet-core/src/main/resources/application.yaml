spring:
  application:
    name: novawallet-core

  datasource:
    url: jdbc:postgresql://localhost:5434/novawallet_db
    username: ${DB_USERNAME:novawallet}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true

server:
  port: 8081

